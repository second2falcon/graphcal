#
# Weekly update pull requests; CI runs on each, nothing changes until it's merged.
version: 2
updates:
  # Actions are pinned to commit SHAs; updates change the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Development tools only (tests, Psalm, Nextcloud API stubs); the app archive ships no Composer packages.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ['*']
    ignore:
      # Must match the copy Nextcloud server bundles (4.5.x), which the app uses at runtime.
      - dependency-name: sabre/vobject

  # Playwright for the browser test and screenshots.
  - package-ecosystem: npm
    directory: /tests/integration
    schedule:
      interval: weekly
